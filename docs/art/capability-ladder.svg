<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages resolving one shader input: stage header, capability level, ownership, scratch, native, bridge, spatial, identity. Every Elder stage must define seventeen contract macros before it includes the shared header, and a missing one raises a compile error naming the declaration that is absent. The capability level is one of four rungs, ordered identity, spatial, bridge, native, and a stage that declares an input above its own level is refused. Ownership is declared per surface: colour, depth, normal, mask, the native celestial and view inputs, the previous scalar adaptation, and the bridge value. Current-frame scratch has ten named surfaces, and a stage may read only the one it owns. Resolution then descends the ladder. The native route is taken first when the stage declares a native input and that input reports availability. The bridge route is a versioned SkyrimBridge-compatible value, one rung down. The spatial route is a bounded reconstruction from what is already drawn. When no route has confidence, the stage returns the exact Elder-authored identity pixel. Full-frame history, object motion, scratch treated as history and cross-effect alpha packing are each refused outright in this release. Three outcomes: a declared input answered on the native or bridge route, a bounded spatial fallback that is named as a fallback, and the authored pixel unchanged."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">A SHADER THAT GUESSES AT AN INPUT NOBODY GAVE IT IS WORSE THAN ONE THAT DOES NOTHING</text><text class="h" x="44" y="72">How a stage resolves an input, or returns the authored pixel</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M592.25 206V228H143.25V213"/><text class="k" x="367.75" y="245" text-anchor="middle" fill="var(--drift)">AN UNDECLARED INPUT FAILS THE BUILD</text><path class="back" marker-end="url(#ab)" d="M816.75 398V420H367.75V405"/><text class="k" x="592.25" y="437" text-anchor="middle" fill="var(--drift)">LOW CONFIDENCE FALLS A RUNG</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Stage header</text><text class="s" x="58" y="168">Seventeen declarations, or no</text><text class="s" x="58" y="183">build.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Capability level</text><text class="s" x="282.5" y="168">Identity, spatial, bridge,</text><text class="s" x="282.5" y="183">native.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Ownership</text><text class="s" x="507" y="168">Depth, normal, mask, bridge</text><text class="s" x="507" y="183">value.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Scratch</text><text class="s" x="731.5" y="168">One named surface, read by its</text><text class="s" x="731.5" y="183">owner.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Native</text><text class="s" x="58" y="360">Taken first, when it is</text><text class="s" x="58" y="375">available.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Bridge</text><text class="s" x="282.5" y="360">A versioned value, one rung</text><text class="s" x="282.5" y="375">down.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Spatial</text><text class="s" x="507" y="360">A bounded read of what is</text><text class="s" x="507" y="375">drawn.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Identity</text><text class="s" x="731.5" y="360">The authored pixel, unchanged.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">NATIVE OR BRIDGE</text><text class="s" x="58" y="509" font-size="10.5">a declared input answered</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">SPATIAL FALLBACK</text><text class="s" x="357.33" y="509" font-size="10.5">bounded, and named as a fallback</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">IDENTITY</text><text class="s" x="656.67" y="509" font-size="10.5">the authored pixel, unchanged</text><text class="s" x="44" y="546">The ladder is resolved by the preprocessor rather than by a runtime branch. A stage that does not declare a native, bridge or spatial input has that arm removed before the shader is compiled, so it cannot fall through to a route it never claimed. Reading scratch the stage does not own is a compile error, and so is treating current-frame scratch as history.</text></svg>
