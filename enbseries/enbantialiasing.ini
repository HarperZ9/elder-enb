[ANTIALIASING]

# Used when DLAA is available
# Default: 2 (DLAA)
Method = 2

# Used when DLAA is not available
# Default: 1 (FSR)
MethodNoDLAA = 1

# RCAS sharpening, range of 0.0 to 1.0
# Default: 0.5
Sharpness = 0.500000

# DLAA preset which affects image clarity and ghosting
# Default: 5 (Preset E)
DLAAPreset = 5
