[OVERLAYINFO]
UIName = LENS - Full Cinematic
UIGroups = 03 - Lens Distortion
UIDesc = Complete cinematic lens package with anamorphic flares, reflections, dirt, and chromatic aberration.
UIOrdering = 152
NeedsNoApply = false
IncompatibleOverlays =

; ============================================
; Enable All Lens Effects
; ============================================

[OVERLAYPARAM1]
Category = ENBLENS.FX
Name = |- Enable Anamorphic Lens Flares
Operation = "= true"

[OVERLAYPARAM2]
Category = ENBLENS.FX
Name = |- Enable Lens Reflections
Operation = "= true"

[OVERLAYPARAM3]
Category = ENBLENS.FX
Name = |- Enable Lens Dirt
Operation = "= true"

[OVERLAYPARAM4]
Category = ENBLENS.FX
Name = |- Enable Chromatic Aberration
Operation = "= true"

; ============================================
; Anamorphic Flares - Balanced
; ============================================

[OVERLAYPARAM5]
Category = ENBLENS.FX
Name = |- AnamFlare - Day - Intensity
Operation = "+ 0.3"

[OVERLAYPARAM6]
Category = ENBLENS.FX
Name = |- AnamFlare - Night - Intensity
Operation = "+ 0.5"

[OVERLAYPARAM7]
Category = ENBLENS.FX
Name = |- AnamFlare - Interior - Intensity
Operation = "+ 0.2"

; ============================================
; Lens Reflections - Subtle
; ============================================

[OVERLAYPARAM8]
Category = ENBLENS.FX
Name = |- Reflection - Day - Intensity
Operation = "+ 1.5"

[OVERLAYPARAM9]
Category = ENBLENS.FX
Name = |- Reflection - Night - Intensity
Operation = "+ 2.5"

[OVERLAYPARAM10]
Category = ENBLENS.FX
Name = |- Reflection - Interior - Intensity
Operation = "+ 1.0"

; ============================================
; Lens Dirt - Light
; ============================================

[OVERLAYPARAM11]
Category = ENBLENS.FX
Name = |- Dirt - Day - Intensity
Operation = "+ 0.2"

[OVERLAYPARAM12]
Category = ENBLENS.FX
Name = |- Dirt - Night - Intensity
Operation = "+ 0.3"

; ============================================
; Chromatic Aberration - Subtle
; ============================================

[OVERLAYPARAM13]
Category = ENBLENS.FX
Name = |- CA - Strength
Operation = "+ 0.5"

[OVERLAYPARAM14]
Category = ENBLENS.FX
Name = |- CA - Curve
Operation = "+ 0.3"
