[OVERLAYINFO]
UIName = STYLE - Arctic Silence
UIGroups = 10 - KreatE Presets
UIDesc = Frozen stillness at the edge of the world. High-key ice-white, minimal saturation. Sound itself seems to freeze in the air.
UIOrdering = 28
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

