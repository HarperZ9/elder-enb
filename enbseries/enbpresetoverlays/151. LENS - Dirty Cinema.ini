[OVERLAYINFO]
UIName = LENS - Dirty Cinema
UIGroups = 03 - Lens Distortion
UIDesc = Lens dirt overlay for used cinema lens character. Dust and smudges catch light realistically.
UIOrdering = 151
NeedsNoApply = false
IncompatibleOverlays =

; ============================================
; Enable Lens Dirt
; ============================================

[OVERLAYPARAM1]
Category = ENBLENS.FX
Name = |- Enable Lens Dirt
Operation = "= true"

[OVERLAYPARAM2]
Category = ENBLENS.FX
Name = |- Dirt - Day - Intensity
Operation = "+ 0.3"

[OVERLAYPARAM3]
Category = ENBLENS.FX
Name = |- Dirt - Night - Intensity
Operation = "+ 0.5"

[OVERLAYPARAM4]
Category = ENBLENS.FX
Name = |- Dirt - Interior - Intensity
Operation = "+ 0.2"

[OVERLAYPARAM5]
Category = ENBLENS.FX
Name = |- Dirt - Day - Power
Operation = "+ 0.5"

[OVERLAYPARAM6]
Category = ENBLENS.FX
Name = |- Dirt - Night - Power
Operation = "+ 0.5"

[OVERLAYPARAM7]
Category = ENBLENS.FX
Name = |- Dirt - Select Texture
Operation = "= 1"
