[OVERLAYINFO]
UIName = DOF - Landscape
UIGroups = 09 - Depth of Field
UIDesc = From foreground flowers to distant peaks, everything breathes in sharp clarity. The world traveler's lens, capturing vastness in focus.
UIOrdering = 70
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

; ============================================
; LANDSCAPE - INFINITE CLARITY
; ============================================
; The hyperfocal discipline mastered. Sharp
; from near to far, the way landscape masters
; shoot. When every layer of the world
; deserves equal attention and clarity.
; ============================================

