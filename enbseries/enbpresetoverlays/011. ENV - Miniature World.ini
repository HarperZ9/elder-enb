[OVERLAYINFO]
UIName = ENV - Miniature World
UIGroups = 14 - Environment Lighting
UIDesc = Reality shrinks to tabletop scale. Saturated toy-like colors, crisp lighting, and enhanced definition create a diorama dreamscape.
UIOrdering = 11
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

; ============================================
; MINIATURE WORLD - DIORAMA MAGIC
; ============================================
; The tilt-shift illusion transforms the
; world into a toy. Colors pop with plastic
; intensity, shadows sharpen precisely.
; Skyrim becomes a beautifully crafted model.
; ============================================

; ============================================
; VOLUMETRIC FOG - Soft diorama atmosphere
; ============================================

[OVERLAYPARAM1]
FileName = enbseries.ini
Category = VOLUMETRICFOG
