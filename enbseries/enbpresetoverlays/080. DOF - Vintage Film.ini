[OVERLAYINFO]
UIName = DOF - Vintage Film
UIGroups = 09 - Depth of Field
UIDesc = Grandfather's camera lives again. Pentagonal bokeh, chromatic fringing, optical imperfection as art. Nostalgia through flawed glass.
UIOrdering = 80
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

; ============================================
; VINTAGE FILM - IMPERFECT NOSTALGIA
; ============================================
; Before aspherical elements and computer-
; designed coatings. Five-blade apertures,
; chromatic sins, and character in every flaw.
; The romance of optical imperfection.
; ============================================

