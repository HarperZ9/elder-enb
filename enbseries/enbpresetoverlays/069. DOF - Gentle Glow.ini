[OVERLAYINFO]
UIName = DOF - Gentle Glow
UIGroups = 09 - Depth of Field
UIDesc = Softness without sacrifice. Light diffuses into gentle halos while focus remains readable. The romantic compromise of clarity and dream.
UIOrdering = 69
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

; ============================================
; GENTLE GLOW - SOFT FOCUS ROMANCE
; ============================================
; Not quite dreamy, not quite sharp. The
; gentle middle ground where subjects glow
; with flattering light. Perfect for portraits
; that need to feel approachable and warm.
; ============================================

