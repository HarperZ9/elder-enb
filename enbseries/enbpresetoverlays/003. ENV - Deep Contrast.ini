[OVERLAYINFO]
UIName = ENV - Deep Contrast
UIGroups = 14 - Environment Lighting
UIDesc = Light and shadow wage eternal war. Sunbeams cut like blades, darkness pools in defiance. No middle ground, no compromise.
UIOrdering = 3
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

; ============================================
; DEEP CONTRAST - CHIAROSCURO MASTERY
; ============================================
; The Renaissance masters understood this -
; the power of extreme light against shadow.
; Bold, punchy, unapologetic contrast that
; gives form and presence to every surface.
; ============================================

