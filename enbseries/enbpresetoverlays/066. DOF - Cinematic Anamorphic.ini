[OVERLAYINFO]
UIName = DOF - Cinematic Anamorphic
UIGroups = 09 - Depth of Field
UIDesc = The silver screen breathes through horizontal oval bokeh. Panavision dreams rendered in real-time. Every frame screams cinema.
UIOrdering = 66
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

; ============================================
; CINEMATIC ANAMORPHIC - WIDESCREEN DREAMS
; ============================================
; The distinctive look of anamorphic cinema
; lenses. Horizontal stretch creates elliptical
; bokeh that screams blockbuster. Hollywood
; production value in every frame.
; ============================================

; ============================================
; DOF Core - Cinematic depth characteristics
; ============================================

[OVERLAYPARAM1]
Category = ENBDEPTHOFFIELD.FX
Name = |- DOF - Near Blur Curve
Operation = "+ -0.8"

[OVERLAYPARAM2]
Category = ENBDEPTHOFFIELD.FX
Name = |- DOF - Far Blur Curve
Operation = "+ -0.4"

[OVERLAYPARAM3]
