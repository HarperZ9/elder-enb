[OVERLAYINFO]
UIName = LENS - Anamorphic
UIGroups = 03 - Lens Distortion
UIDesc = Classic anamorphic lens flares for cinematic widescreen look. Horizontal streaks on bright light sources.
UIOrdering = 147
NeedsNoApply = false
IncompatibleOverlays =

; ============================================
; Enable Anamorphic Lens Flares
; ============================================

[OVERLAYPARAM1]
Category = ENBLENS.FX
Name = |- Enable Anamorphic Lens Flares
Operation = "= true"

[OVERLAYPARAM2]
Category = ENBLENS.FX
Name = |- AnamFlare - Day - Intensity
Operation = "+ 0.5"

[OVERLAYPARAM3]
Category = ENBLENS.FX
Name = |- AnamFlare - Night - Intensity
Operation = "+ 0.8"

[OVERLAYPARAM4]
Category = ENBLENS.FX
Name = |- AnamFlare - Interior - Intensity
Operation = "+ 0.3"

[OVERLAYPARAM5]
Category = ENBLENS.FX
Name = |- AnamFlare - Rotation
Operation = "= 90.0"

[OVERLAYPARAM6]
Category = ENBLENS.FX
Name = |- AnamFlare - Width
Operation = "+ 5.0"

[OVERLAYPARAM7]
Category = ENBLENS.FX
Name = |- AnamFlare - Core Intensity
Operation = "+ 0.5"
