[OVERLAYINFO]
UIName = STYLE - Maritime Noir
UIGroups = 10 - KreatE Presets
UIDesc = The Lighthouse madness. Salt-stained desolation, extreme contrast B&W with sea-green undertones. Isolation breeds insanity.
UIOrdering = 42
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

