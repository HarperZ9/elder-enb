[OVERLAYINFO]
UIName = ENV - Lifted Shadows
UIGroups = 14 - Environment Lighting
UIDesc = Darkness retreats from every corner. Soft light fills where shadows once ruled. A gentle world where nothing hides in black.
UIOrdering = 6
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

; ============================================
; LIFTED SHADOWS - GENTLE REVELATION
; ============================================
; Shadows lose their depth, their mystery.
; Light reaches everywhere, soft and even.
; Details emerge from darkness. The world
; feels approachable, readable, safe.
; ============================================

; ============================================
; VOLUMETRIC FOG - Reduced atmospheric density
; ============================================

[OVERLAYPARAM1]
FileName = enbseries.ini
Category = VOLUMETRICFOG
