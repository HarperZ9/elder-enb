[OVERLAYINFO]
UIName = ENV - Alternative Baseline 1
UIGroups = 14 - Environment Lighting
UIDesc = Cleaner daytime clarity meets deeper night mystery. Fog retreats from the sun's dominion while shadows claim the starlit hours.
UIOrdering = 0
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

; ============================================
; ALTERNATIVE BASELINE 1 - CLARITY & MYSTERY
; ============================================
; A departure from the default balance. Days
; emerge clearer and crisper while nights
; deepen into atmospheric mystery. The world
; breathes differently under this profile.
; ============================================

