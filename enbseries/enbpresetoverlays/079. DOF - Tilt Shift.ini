; ============================================
; TILT SHIFT - MINIATURE ILLUSION
; ============================================
; The architect's lens tilted to deceive.
; Shallow bands of focus fool the brain into
; perceiving toys where giants walk. Cities
; become model railroads, cars become playthings.
; ============================================

