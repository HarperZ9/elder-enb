[OVERLAYINFO]
UIName = DOF - Tilt Shift
UIGroups = 09 - Depth of Field
UIDesc = Reality shrinks to tabletop scale. The world becomes a meticulously crafted diorama. Toy towns and miniature kingdoms await.
