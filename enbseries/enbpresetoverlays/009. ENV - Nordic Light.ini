[OVERLAYINFO]
UIName = ENV - Nordic Light
UIGroups = 14 - Environment Lighting
UIDesc = Arctic clarity cuts through thin polar atmosphere. Cold, harsh daylight scours the tundra. The pale sun of northern latitudes rules this realm.
UIOrdering = 9
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

; ============================================
; NORDIC LIGHT - POLAR CLARITY
; ============================================
; The light of high latitudes where the sun
; hangs low and air is crisp. Pale, harsh,
; unforgiving daylight gives way to deep
; blue nights under the aurora's dance.
; ============================================

