[OVERLAYINFO]
UIName = DOF - Artistic Swirl
UIGroups = 09 - Depth of Field
UIDesc = The Helios dance in light. Bokeh spirals at frame edges like painted brushstrokes. Soviet glass magic captured in digital form.
UIOrdering = 63
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

; ============================================
; ARTISTIC SWIRL - HELIOS DREAMS
; ============================================
; The legendary Russian Helios 44-2 lives on.
; Bokeh rotates and swirls at frame edges,
; creating painterly backgrounds that have
; captivated photographers for generations.
; ============================================

; ============================================
; DOF Core - Strong rotation-enhanced blur
; ============================================

[OVERLAYPARAM1]
Category = ENBDEPTHOFFIELD.FX
Name = |- DOF - Near Blur Curve
Operation = "+ 2.2"

[OVERLAYPARAM2]
Category = ENBDEPTHOFFIELD.FX
Name = |- DOF - Far Blur Curve
Operation = "+ 2.8"

[OVERLAYPARAM3]
Category = ENBDEPTHOFFIELD.FX
Name = |- DOF - Hyperfocal Depth Distance
Operation = "+ -0.005"

[OVERLAYPARAM4]
Category = ENBDEPTHOFFIELD.FX
Name = |- DOF - Gaussian PostBlur Width
Operation = "+ 2.8"

