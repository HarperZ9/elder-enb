[OVERLAYINFO]
UIName = DOF - Bubble Bokeh
UIGroups = 09 - Depth of Field
UIDesc = Soap bubbles float through every scene. Bright-centered orbs of light shimmer and dance. Magic made visible in spherical perfection.
UIOrdering = 64
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

; ============================================
; BUBBLE BOKEH - LUMINOUS SPHERES
; ============================================
; Spherical aberration pushed to beautiful
; extremes. Highlights bloom into perfect
; bubbles with bright centers and soft edges.
; Every light source becomes a floating orb.
; ============================================

