[OVERLAYINFO]
UIName = ENV - Alternative Baseline 2
UIGroups = 14 - Environment Lighting
UIDesc = Transitions take center stage. Dawn and dusk bloom with atmospheric presence while midday and midnight rest in quiet equilibrium.
