[OVERLAYINFO]
UIName = ENV - Golden Hour
UIGroups = 14 - Environment Lighting
UIDesc = The sun lingers at the horizon's edge, painting everything in honey and amber. Photographers wait their whole lives for this light.
UIOrdering = 5
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

; ============================================
; GOLDEN HOUR - PHOTOGRAPHER'S DREAM
; ============================================
; That magical window when the sun hangs low.
; Warm amber kisses every surface. Shadows
; stretch long and soft. This is the light
; that makes ordinary things beautiful.
; ============================================

