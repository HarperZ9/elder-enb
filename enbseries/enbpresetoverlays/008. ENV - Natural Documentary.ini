[OVERLAYINFO]
UIName = ENV - Natural Documentary
UIGroups = 14 - Environment Lighting
UIDesc = The lens of truth captures nature unembellished. Clean, honest light reveals the world as it is. BBC Earth would approve.
UIOrdering = 8
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

; ============================================
; NATURAL DOCUMENTARY - TRUTH IN LIGHT
; ============================================
; The camera doesn't lie, and neither does
; this lighting. Accurate, balanced, real.
; Perfect for those who want to see Skyrim
; as the wildlife documentarians would film it.
; ============================================

