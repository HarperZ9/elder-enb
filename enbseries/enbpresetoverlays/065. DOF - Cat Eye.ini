[OVERLAYINFO]
UIName = DOF - Cat Eye
UIGroups = 09 - Depth of Field
UIDesc = The mysterious gaze of feline optics. Bokeh stretches oval at frame edges, swirling with vintage character. A predator's vision in glass.
UIOrdering = 65
NeedsNoApply = false
IncompatibleOverlays =
AmountMin = 0.00
AmountMax = 1.00

; ============================================
; CAT EYE - FELINE OPTICS
; ============================================
; Classic vintage lens aberration rendered
; beautiful. Bokeh elongates into cat-eye
; ovals at frame edges, creating swirly
; backgrounds with hypnotic character.
; ============================================

; ============================================
; DOF Core - Pronounced edge distortion
; ============================================

[OVERLAYPARAM1]
Category = ENBDEPTHOFFIELD.FX
Name = |- DOF - Near Blur Curve
Operation = "+ 2.8"

[OVERLAYPARAM2]
Category = ENBDEPTHOFFIELD.FX
Name = |- DOF - Far Blur Curve
Operation = "+ 3.2"

[OVERLAYPARAM3]
Category = ENBDEPTHOFFIELD.FX
Name = |- DOF - Hyperfocal Depth Distance
Operation = "+ -0.012"

[OVERLAYPARAM4]
